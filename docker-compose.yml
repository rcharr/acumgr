services:
  acumgr:
    build: .
    container_name: acumgr
    restart: unless-stopped
    ports:
      - "${PORT:-9001}:9001"
    volumes:
      # Mount config.json so you can edit it without rebuilding
      - ./server/config.json:/app/config.json:ro
      - ./server/history.json:/app/history.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
